<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe1ee">
  <meta name="description" content="Mimos da Cris: papelaria digital feita com carinho. Papéis de carta cristãos, etiquetas escolares e muitas novidades.">
  <title>Mimos da Cris | Papelaria Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./script.js"></script>
</head>
<body>
  <main class="pagina">
    <!-- Ilustração recortada do modelo aprovado -->
    <header class="cabecalho">
      <img src="./assets/cabecalho.webp" width="654" height="315"
        alt="Mimos da Cris — Papelaria Digital. Uma criação Cris Lopes Art. Mascote com laço rosa e materiais de papelaria.">
    </header>

    <!-- Cada cartão é um link de verdade; a ilustração conserva o visual do modelo. -->
    <nav class="botoes" aria-label="Links da Mimos da Cris">
      <a id="link-papel" class="cartao" href="https://pay.kiwify.com.br/A8X0S4d" aria-label="Comprar Papel de Carta Cristão — 15 estampas para imprimir">
        <img src="./assets/papel-de-carta.webp" width="654" height="146" alt="Papel de Carta Cristão — 15 estampas para imprimir">
      </a>

      <a id="link-etiquetas" class="cartao" href="https://pay.kiwify.com.br/Fe74RXt"
        aria-label="Conhecer o Kit de Etiquetas Escolares infantis para imprimir">
        <img src="./assets/etiquetas-escolares.webp" width="654" height="145" alt="Kit de Etiquetas Escolares — infantis para imprimir" loading="lazy">
      </a>

      <button id="link-loja" class="cartao cartao--botao" type="button" aria-label="Loja Mimos da Cris — em breve">
        <img src="./assets/loja.webp" width="654" height="146" alt="Loja Mimos da Cris — em breve, mais produtos para você" loading="lazy">
      </button>

      <a id="link-whatsapp" class="cartao" href="https://wa.me/5564984188628" target="_blank" rel="noopener noreferrer"
        aria-label="Fale conosco no WhatsApp">
        <img src="./assets/whatsapp.webp" width="654" height="141" alt="Fale comigo no WhatsApp — tire suas dúvidas" loading="lazy">
      </a>

      <!-- Card da Cris Lopes Art: visual pastel e texto editável -->
      <a id="link-site" class="cartao cartao--site" href="https://www.crislopesart.com.br/"
        target="_blank" rel="noopener noreferrer"
        aria-label="Quer ter sua loja virtual? Conheça a Cris Lopes Art">
        <span class="site-ilustracao" aria-hidden="true">
          <svg viewBox="0 0 72 72" role="presentation" focusable="false">
            <rect x="9" y="14" width="54" height="39" rx="6" fill="#fffafb" stroke="#d571a5" stroke-width="2"/>
            <rect x="14" y="20" width="44" height="27" rx="3" fill="#ffe6f1"/>
            <rect x="18" y="25" width="13" height="6" rx="3" fill="#ed92bc"/>
            <rect x="18" y="34" width="20" height="3" rx="1.5" fill="#cf92bc"/>
            <rect x="18" y="40" width="28" height="3" rx="1.5" fill="#dbaecc"/>
            <path d="M28 53l-3 5m19-5 3 5M18 59h36" fill="none" stroke="#ae6b9e" stroke-width="3" stroke-linecap="round"/>
            <path d="M48 27c-4.3-6.7-12.4-.9-7.4 4.9l7.4 6.9 7.4-6.9c5-5.8-3.1-11.6-7.4-4.9Z" fill="#f48fb3"/>
            <path d="M9 11l2.5-4L14 11l4 2.5-4 2.5-2.5 4-2.5-4L5 13.5Z" fill="#ed9cbd"/>
          </svg>
        </span>
        <span class="site-texto">
          <strong>Quer ter sua loja virtual?</strong>
          <small>Conheça a Cris Lopes Art</small>
        </span>
        <span class="site-seta" aria-hidden="true">❯</span>
      </a>
    </nav>

    <footer class="rodape">
      <div class="tracinho" aria-hidden="true"><span>♡</span></div>
      <div class="contatos" aria-label="Contato e redes sociais">
        <a href="https://www.instagram.com/mimosdacrisdigital/" target="_blank" rel="noopener noreferrer" aria-label="Instagram da Mimos da Cris">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.3" y="2.3" width="19.4" height="19.4" rx="5.5"/><circle cx="12" cy="12" r="4.3"/><circle class="preencher" cx="17.8" cy="6.3" r="1.1"/></svg>
          <span>Instagram</span>
        </a>
        <a id="rodape-whatsapp" href="https://wa.me/5564984188628" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp da Mimos da Cris">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 11.6a8.7 8.7 0 0 1-12.5 7.8L3.4 21l1.5-4.7A8.7 8.7 0 1 1 20.6 11.6Z"/><path d="M8.6 8.1c.5 3.6 3.4 6.5 7 6.9l1.2-1.5-2.2-1.2-1.1 1c-1.6-.7-2.6-1.7-3.3-3.3l1-1.1-1.2-2.2Z"/></svg>
          <span>WhatsApp</span>
        </a>
        <a id="rodape-email" href="mailto:crislopes.contato26@gmail.com" aria-label="Enviar e-mail para a Mimos da Cris">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3.3 6 8.7 7 8.7-7"/></svg>
          <span>E-mail</span>
        </a>
      </div>
      <div class="faixa-final">
        <div class="decor decor-esq" aria-hidden="true">✿</div>
        <div>
          <p><strong>Mimos da Cris</strong> <span>| Papelaria Digital</span></p>
          <small>Uma criação Cris Lopes Art.</small>
        </div>
        <div class="decor decor-dir" aria-hidden="true">✿</div>
      </div>
    </footer>
  </main>
  <div id="aviso" role="status" aria-live="polite" class="aviso" hidden></div>

</html>
